name: Deploy Dees International Web

on:
  push:
    branches:
      - 'main'
      - 'dev'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:

      - name: CODE CHECK-OUT
        uses: actions/checkout@v2

      - name: INSTALL THE GCLOUD CLI
        uses: google-github-actions/setup-gcloud@v0
        with:
          project_id: ${{ secrets.GOOGLE_PROJECT }}
          service_account_key: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
          install_components: 'gke-gcloud-auth-plugin'
          export_default_credentials: true

      - name: SET COMMON ENVIRONEMENT SPECIFIC VARIABLES
        run: |
          echo "GOOGLE_PROJECT=${{ secrets.GOOGLE_PROJECT }}" >> $GITHUB_ENV
          echo "IMAGE_TAG=$(date +'%Y%m%d%H%M%S')" >> $GITHUB_ENV

      - name: SET ENVIRONEMENT SPECIFIC VARIABLES FOR MAIN
        if: github.ref == 'refs/heads/main'
        run: |
          echo "NEXT_PUBLIC_=https://sanasa-api-service-prod-ejea6bo5rq-wl.a.run.app" >> $GITHUB_ENV
          echo "SERVICE_NAME=dees-international-web-service-prod" >> $GITHUB_ENV

      - name: SET ENVIRONEMENT SPECIFIC VARIABLES FOR DEV
        if: github.ref == 'refs/heads/dev'
        run: |
          echo "NEXT_PUBLIC_=https://sanasa-api-service-ejea6bo5rq-wl.a.run.app" >> $GITHUB_ENV
          echo "SERVICE_NAME=dees-international-web-service" >> $GITHUB_ENV

      - name: SET DOCKER IMAGE NAME FOR MAIN
        if: github.ref == 'refs/heads/main'
        run: |
          echo "DOCKER_IMAGE=us-west2-docker.pkg.dev/${{ secrets.GOOGLE_PROJECT }}/dees-international-web-repo/dees-international-web-image-prod:${{ env.IMAGE_TAG }}" >> $GITHUB_ENV
      
      - name: SET DOCKER IMAGE NAME FOR DEV
        if: github.ref == 'refs/heads/dev'
        run: |    
          echo "DOCKER_IMAGE=us-west2-docker.pkg.dev/${{ secrets.GOOGLE_PROJECT }}/dees-international-web-repo/dees-international-web-image:${{ env.IMAGE_TAG }}" >> $GITHUB_ENV

      - name: BUILD AND PUSH THE DOCKER IMAGE
        env:
          GOOGLE_PROJECT: ${{ secrets.GOOGLE_PROJECT }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          DOCKER_IMAGE: ${{ env.DOCKER_IMAGE }}
          NEXT_PUBLIC_: ${{ env.NEXT_PUBLIC_ }}
        run: |
          gcloud auth configure-docker us-west2-docker.pkg.dev
          docker build \
            --build-arg ARG_REACT_APP_SERVER_URL=$NEXT_PUBLIC_ \
            -t ${DOCKER_IMAGE} .

          docker push ${DOCKER_IMAGE}

      - name: DEPLOY TO GOOGLE CLOUD RUN
        env:
          GOOGLE_PROJECT: ${{ secrets.GOOGLE_PROJECT }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          SERVICE_NAME: ${{ env.SERVICE_NAME }}
          DOCKER_IMAGE: ${{ env.DOCKER_IMAGE }}
        run: |
          gcloud run deploy $SERVICE_NAME \
            --image=${DOCKER_IMAGE} \
            --region=us-west2 \
            --platform=managed \
            --allow-unauthenticated